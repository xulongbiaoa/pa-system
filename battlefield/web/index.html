<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>虚拟战场 · 最小可视化（W09）</title>
<style>
  :root { --ink:#16140f; --paper:#fbfaf6; --line:#ddd8cb; --panel:#f1ede1;
          --up:#1f7a5c; --down:#bc3f22; --warn:#b07d2b; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: "Noto Serif SC", serif; background:var(--paper); color:var(--ink); }
  header { padding:10px 14px; border-bottom:2px solid var(--ink); display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  header h1 { font-size:17px; margin:0 12px 0 0; }
  .meta { font-size:12px; color:#444; }
  .badge { display:inline-block; padding:1px 7px; border:1px solid var(--ink); border-radius:9px; font-size:11px; margin-right:5px; background:#fff; }
  .badge.stale { border-color:var(--warn); color:var(--warn); font-weight:700; }
  .badge.bad { border-color:var(--down); color:var(--down); font-weight:700; }
  button, select { font:inherit; font-size:13px; background:#fff; border:1px solid var(--ink); padding:3px 10px; cursor:pointer; }
  button.on { background:var(--ink); color:#fff; }
  main { display:grid; grid-template-columns: minmax(0,1fr) 400px; gap:0; }
  #chartWrap { padding:10px 8px 4px 12px; border-right:1px solid var(--line); }
  #chart { width:100%; height:520px; }
  .layers { font-size:12.5px; padding:6px 2px; display:flex; gap:14px; flex-wrap:wrap; align-items:center; }
  aside { padding:10px 12px; display:flex; flex-direction:column; gap:12px; max-height:calc(100vh - 60px); overflow:auto; }
  section { border:1px solid var(--line); background:#fff; }
  section h2 { font-size:13.5px; margin:0; padding:7px 10px; background:var(--panel); border-bottom:1px solid var(--line); }
  section .body { padding:8px 10px; font-size:12.8px; line-height:1.55; }
  .ev { padding:5px 6px; border-bottom:1px dashed var(--line); cursor:pointer; }
  .ev:hover { background:var(--panel); }
  .ev.sel { background:#fdf3e3; outline:1px solid var(--warn); }
  .ev .t { font-weight:700; }
  .lens-terrain { color:#555; } .lens-actor { color:var(--up); } .lens-terrain_actor { color:var(--down); }
  .hyp { border-left:3px solid var(--ink); padding:4px 8px; margin-bottom:8px; background:#fffdf6; }
  .hyp.challenged { border-left-color:var(--warn); } .hyp.superseded { opacity:.55; border-left-color:#999; }
  .ref { color:#1a4f8a; cursor:pointer; text-decoration:underline dotted; }
  .seg { margin:3px 0; } .seg b { display:inline-block; min-width:64px; }
  .side { display:flex; gap:10px; } .side > div { flex:1; }
  .note { width:100%; font:inherit; font-size:12.5px; }
  .anno { font-size:12px; background:#eef4ff; border-left:3px solid #1a4f8a; padding:3px 7px; margin:4px 0; }
  footer { padding:8px 14px; font-size:11.5px; color:#555; border-top:1px solid var(--line); }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } aside { max-height:none; } }
</style>
</head>
<body>
<header>
  <h1>虚拟战场</h1>
  <span>
    <button id="symBTC" class="on">BTCUSDT 15m</button>
    <button id="symETH">ETHUSDT 15m</button>
  </span>
  <span>
    模式
    <select id="modeSel">
      <option value="live">LIVE（最新投影）</option>
    </select>
  </span>
  <span class="meta" id="metaLine">加载中…</span>
</header>
<main>
  <div id="chartWrap">
    <div id="chart"></div>
    <div class="layers">
      <label><input type="checkbox" id="lyGaps" checked> 开放缺口锚线</label>
      <label><input type="checkbox" id="lyLevels" checked> 主要地形（SWM）</label>
      <label><input type="checkbox" id="lyEvents" checked> 事件标记</label>
      <label><input type="checkbox" id="lyTests" checked> 缺口测试区间</label>
      <span class="meta" id="layerInfo"></span>
    </div>
    <div class="meta" style="padding:0 2px 8px">时间轴为北京时间。实线=已发生事实；假设只在右侧面板以文字出现，本页不在图上画预测路径。点击时间线事件或假设引用可定位证据。</div>
  </div>
  <aside>
    <section><h2>双方最近行动（事实段，非兵力）</h2><div class="body" id="sidesBody"></div></section>
    <section><h2>当前假设（参谋简报）</h2><div class="body" id="hypBody"></div></section>
    <section><h2>观察计划（作战计划卡）</h2><div class="body" id="planBody"></div></section>
    <section><h2>行动时间线</h2><div class="body" id="tlBody" style="padding:4px 6px"></div></section>
    <section><h2>人工批注（独立保存，不改事实）</h2><div class="body">
      <div class="meta" id="annoCtx">先在时间线点选一个事件，再写批注。</div>
      <textarea class="note" id="annoText" rows="2" placeholder="批注内容"></textarea>
      <div style="margin-top:5px"><button id="annoAdd">添加批注</button></div>
      <div id="annoList"></div>
    </div></section>
  </aside>
</main>
<footer id="footLine"></footer>
<script src="lib/lightweight-charts.standalone.production.js"></script>
<script src="app.js"></script>
</body>
</html>
