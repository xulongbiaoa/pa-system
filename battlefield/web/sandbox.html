<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>虚拟战场 · 战略沙盘（W09）</title>
<style>
  :root { --ink:#16140f; --paper:#fbfaf6; --line:#ddd8cb; --panel:#f1ede1;
          --up:#1f7a5c; --down:#bc3f22; --warn:#b07d2b; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:"Noto Serif SC", serif; background:var(--paper); color:var(--ink); }
  header { padding:10px 14px; border-bottom:2px solid var(--ink); display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  header h1 { font-size:17px; margin:0 12px 0 0; }
  .meta { font-size:12px; color:#444; }
  .badge { display:inline-block; padding:1px 7px; border:1px solid var(--ink); border-radius:9px; font-size:11px; margin-right:5px; background:#fff; }
  .badge.stale { border-color:var(--warn); color:var(--warn); font-weight:700; }
  button { font:inherit; font-size:13px; background:#fff; border:1px solid var(--ink); padding:3px 10px; cursor:pointer; }
  button.on { background:var(--ink); color:#fff; }
  a.tab { font-size:13px; color:var(--ink); text-decoration:none; border:1px solid var(--ink); padding:3px 10px; background:#fff; }
  main { display:grid; grid-template-columns:minmax(0,1fr) 400px; gap:0; }
  #boardWrap { padding:10px 6px 6px 10px; border-right:1px solid var(--line); }
  #board { width:100%; }
  .legend { font-size:12.5px; padding:4px 2px 8px; display:flex; gap:16px; flex-wrap:wrap; }
  .sw { display:inline-block; width:22px; height:9px; vertical-align:middle; margin-right:5px; border:1px solid var(--ink); }
  aside { padding:10px 12px; display:flex; flex-direction:column; gap:12px; max-height:calc(100vh - 58px); overflow:auto; }
  section { border:1px solid var(--line); background:#fff; }
  section h2 { font-size:13.5px; margin:0; padding:7px 10px; background:var(--panel); border-bottom:1px solid var(--line); }
  section .body { padding:8px 10px; font-size:12.8px; line-height:1.55; }
  .hyp { border-left:3px solid var(--ink); padding:4px 8px; margin-bottom:8px; background:#fffdf6; }
  .hyp.challenged { border-left-color:var(--warn); } .hyp.superseded { opacity:.55; }
  .ref { color:#1a4f8a; cursor:pointer; text-decoration:underline dotted; }
  .seg { margin:3px 0; } .seg b { display:inline-block; min-width:64px; }
  .ev { padding:5px 6px; border-bottom:1px dashed var(--line); cursor:pointer; }
  .ev:hover { background:var(--panel); }
  footer { padding:8px 14px; font-size:11.5px; color:#555; border-top:1px solid var(--line); }
  .wallFlash { animation: fl 1.2s ease-in-out 2; }
  @keyframes fl { 50% { opacity:.25; } }
  @media (max-width: 900px) { main { grid-template-columns:1fr; } aside { max-height:none; } }
</style>
</head>
<body>
<header>
  <h1>虚拟战场 · 战略沙盘</h1>
  <span>
    <button id="symBTC" class="on">BTCUSDT 15m</button>
    <button id="symETH">ETHUSDT 15m</button>
  </span>
  <a class="tab" href="index.html">K 线核验页 →</a>
  <span class="meta" id="metaLine">加载中…</span>
</header>
<main>
  <div id="boardWrap">
    <div id="board"></div>
    <div id="laneChips" style="font-size:12.5px;padding:6px 2px 0"></div>
    <div class="legend">
      <span><span class="sw" style="background:#1f7a5c"></span>多方城墙（向上缺口，空方被套于墙下）</span>
      <span><span class="sw" style="background:#bc3f22"></span>空方城墙（向下缺口，多方被套于墙上）</span>
      <span><span class="sw" style="background:#b07d2b"></span>双向争夺墙</span>
      <span>⚔ = 该墙经历的攻城（回补测试）次数</span>
    </div>
    <div class="meta">城池 = 上下两堵缺口墙之间的价格带；墙的厚度、守军与攻城次数全部来自缺口账本事实，本页不生成控制率、兵力或胜率。点城墙或城池看详情。</div>
  </div>
  <aside>
    <section><h2>选中对象</h2><div class="body" id="detailBody">点沙盘上的城墙或城池，这里显示它的账本事实。</div></section>
    <section><h2>参谋简报（当前假设）</h2><div class="body" id="hypBody"></div></section>
    <section><h2>作战计划卡</h2><div class="body" id="planBody"></div></section>
    <section><h2>破城记录（最近关账缺口）</h2><div class="body" id="brokenBody"></div></section>
    <section><h2>战役时间线</h2><div class="body" id="tlBody" style="padding:4px 6px"></div></section>
  </aside>
</main>
<footer id="footLine"></footer>
<script src="sandbox.js"></script>
</body>
</html>
