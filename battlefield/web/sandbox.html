<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PA 战略沙盘 · 虚拟战场</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0a141f; color: #dcebf7; font: 13px/1.55 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  a { color: #3fa9f5; text-decoration: none; }
  .topbar { display: flex; align-items: center; gap: 14px; padding: 8px 14px; background: #0d1b29; border-bottom: 1px solid #1c3448; flex-wrap: wrap; }
  .logo { font-size: 17px; font-weight: 800; letter-spacing: .5px; }
  .logo .pa { color: #3fa9f5; font-style: italic; margin-right: 6px; }
  .seg { display: flex; border: 1px solid #24455e; border-radius: 6px; overflow: hidden; }
  .seg button { background: transparent; color: #9db8cc; border: 0; padding: 4px 12px; cursor: pointer; font-size: 12.5px; }
  .seg button.on { background: #1b3a52; color: #fff; }
  .live { color: #2fbf71; font-weight: 700; font-size: 12px; }
  .muted { color: #7e97ab; font-size: 12px; }
  .badge { border: 1px solid #24455e; border-radius: 20px; padding: 2px 10px; font-size: 11.5px; color: #9db8cc; background: #0e2233; }
  .badge.ai { color: #35c4b5; border-color: #175048; }
  .layout { display: grid; grid-template-columns: 1fr 348px; gap: 10px; padding: 10px; align-items: start; }
  .card { background: #0d1b29; border: 1px solid #1c3448; border-radius: 10px; padding: 10px 12px; }
  .card h3 { margin: 0 0 8px; font-size: 14px; display: flex; align-items: center; gap: 7px; }
  .card h3 .r { margin-left: auto; font-size: 11.5px; color: #7e97ab; font-weight: 400; }
  #chartWrap { position: relative; height: 470px; }
  #chart { position: absolute; inset: 0; }
  .band { position: absolute; left: 0; right: 58px; pointer-events: none; }
  .band .blabel { position: absolute; right: 8px; font-size: 11.5px; font-weight: 700; text-shadow: 0 1px 3px #000; }
  .band .alabel { position: absolute; left: 8px; font-size: 11px; color: #eaf4fd; background: rgba(6,17,27,.75); padding: 0 6px; border-radius: 3px; white-space: nowrap; }
  .anchorLine { position: absolute; left: 0; right: 58px; height: 0; pointer-events: none; }
  .ohlc { font-size: 12px; color: #9db8cc; margin-bottom: 6px; display: flex; gap: 12px; flex-wrap: wrap; }
  .ohlc b { color: #dcebf7; }
  .up { color: #2fbf71; } .down { color: #f0564f; }
  .hypMain { background: rgba(47,191,113,.10); border: 1px solid #175048; border-radius: 8px; padding: 8px 10px; margin-bottom: 9px; }
  .hypMain .t { color: #35c4b5; font-weight: 700; font-size: 12px; margin-bottom: 3px; }
  .evT { color: #9db8cc; font-weight: 700; font-size: 12px; margin: 7px 0 3px; }
  .evT.red { color: #f0564f; }
  .evItem { display: flex; gap: 8px; margin: 3px 0; color: #c6dcee; font-size: 12.5px; }
  .evItem .n { flex: none; width: 17px; height: 17px; border-radius: 50%; border: 1px solid #3d5a73; color: #9db8cc; font-size: 10.5px; text-align: center; line-height: 16px; margin-top: 1px; }
  .step { display: flex; gap: 10px; padding: 7px 0; border-bottom: 1px dashed #1c3448; }
  .step:last-child { border-bottom: 0; }
  .step .n { flex: none; width: 22px; height: 22px; border-radius: 50%; text-align: center; line-height: 21px; font-weight: 700; font-size: 12px; background: #1b3a52; color: #9db8cc; border: 1px solid #2a4d6d; }
  .step.done .n { background: #14532d; color: #7ee2ae; border-color: #1d7a46; }
  .step.act .n { background: #6b4e12; color: #ffd97a; border-color: #a67c1f; }
  .step .st { font-weight: 700; font-size: 12.5px; }
  .step .sd { color: #9db8cc; font-size: 12.5px; }
  .waitB { margin-left: auto; flex: none; border: 1px solid #a67c1f; color: #ffd97a; border-radius: 4px; font-size: 10.5px; padding: 0 6px; height: fit-content; }
  .bottomRow { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 10px; }
  .reason { color: #8fa9bd; font-size: 12px; line-height: 1.55; background: rgba(23,42,59,.5); border-left: 2px solid #3d5a73; padding: 6px 8px; border-radius: 0 6px 6px 0; margin-bottom: 4px; }
  .concl { border-left: 3px solid #ffd97a; background: rgba(107,78,18,.16); padding: 8px 10px; border-radius: 0 8px 8px 0; font-size: 13.5px; font-weight: 600; color: #eaf4fd; line-height: 1.5; margin-bottom: 9px; }
  .phaseB { display: inline-block; border: 1px solid #2a4d6d; color: #9db8cc; border-radius: 4px; font-size: 10.5px; font-weight: 400; padding: 0 5px; margin-left: 6px; vertical-align: 1px; }
  .handB { border: 1px solid #7a2d2d; background: rgba(240,86,79,.07); border-radius: 8px; padding: 7px 10px; margin-top: 8px; font-size: 12.5px; color: #e8c9c7; line-height: 1.55; }
  .handB .t { color: #f0564f; font-weight: 700; font-size: 12px; margin-bottom: 3px; }
  .handB .ntb { color: #8fa9bd; font-size: 11.5px; margin-top: 3px; }
  .layout > *, .bottomRow > *, .card { min-width: 0; }
  .tl { overflow-x: auto; overflow-y: hidden; margin-top: 4px; cursor: grab; scrollbar-width: thin; width: 100%; max-width: 100%; }
  .tl:active { cursor: grabbing; }
  .tlTrack { display: flex; width: max-content; position: relative; padding: 0 4px; }
  .tlTrack:before { content: ""; position: absolute; left: 0; right: 0; top: 30px; border-top: 1px solid #2a4d6d; }
  .tl .node { width: 150px; flex: none; text-align: center; position: relative; padding: 0 5px; }
  .tl .tm { color: #7e97ab; font-size: 11px; height: 22px; }
  .tl .dot { width: 9px; height: 9px; border-radius: 50%; background: #3fa9f5; margin: 0 auto 5px; position: relative; z-index: 1; box-shadow: 0 0 0 3px #0d1b29; }
  .tl .tt { font-weight: 700; font-size: 12.5px; }
  .tl .ts { color: #7e97ab; font-size: 11.5px; min-height: 36px; }
  table.cmp { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.cmp th, table.cmp td { padding: 5px 4px; border-bottom: 1px solid #1c3448; text-align: right; }
  table.cmp th:first-child, table.cmp td:first-child { text-align: left; color: #9db8cc; }
  .foot { color: #55707f; font-size: 11.5px; padding: 2px 12px 12px; }
  @media (max-width: 1100px) { .layout { grid-template-columns: 1fr; } .bottomRow { grid-template-columns: 1fr; } }
  /* 一屏化（用户 2026-11-01 点名）：桌面端整页锁 100vh、不滚动——
     左图弹性伸缩，右栏简报+计划同屏装下；简报万一超高只在卡内滚 */
  @media (min-width: 1101px) {
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    .layout { flex: 1; min-height: 0; align-items: stretch; grid-template-rows: minmax(0, 1fr); }
    .mainCol { display: flex; flex-direction: column; gap: 10px; min-height: 0; min-width: 0; }
    .chartCard { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    #chartWrap { flex: 1; height: auto; min-height: 0; }
    .bottomRow { margin-top: 0; flex: none; }
    .sideCol { min-height: 0; }
    .sideCol > .card { flex: 1; overflow-y: auto; min-height: 0; scrollbar-width: thin; }
    .foot { flex: none; }
    /* 简报排版：不靠压缩密度，靠分段与发丝线——每块之间一条发丝线、
       段距统一，结论与主推演保持原有呼吸感 */
    #hypBody .evT { border-top: 1px solid #1c3448; padding-top: 8px; margin-top: 9px; }
    #hypBody .handB { margin-top: 10px; }
    /* 一屏化的关键让位：右栏加宽到 400 只装简报（字号略收）；
       观察计划卡已按用户 2026-11-01 要求下线，左栏只剩图+时间线 */
    .layout { grid-template-columns: 1fr 400px; }
    .sideCol { font-size: 12.5px; line-height: 1.5; }
  }
  .dirLine { display: flex; gap: 8px; align-items: baseline; background: rgba(63,169,245,.08); border: 1px solid #1e4a66; border-radius: 8px; padding: 6px 10px; margin-bottom: 8px; font-size: 12.5px; color: #c6dcee; }
  .dirLine .dirArr { font-size: 13px; color: #9db8cc; }
  .dirLine .dirArr.up { color: #2fbf71; }
  .dirLine .dirArr.down { color: #f0564f; }
  details.claim { margin: 3px 0; }
  details.claim summary { display: flex; gap: 8px; align-items: baseline; cursor: pointer; list-style: none; color: #c6dcee; font-size: 12.5px; }
  details.claim summary::-webkit-details-marker { display: none; }
  details.claim summary .n { flex: none; width: 17px; height: 17px; border-radius: 50%; border: 1px solid #3d5a73; color: #9db8cc; font-size: 10.5px; text-align: center; line-height: 16px; align-self: center; }
  details.claim summary .ct { font-weight: 600; }
  details.claim summary .more { margin-left: auto; flex: none; color: #55707f; font-size: 11px; }
  details.claim summary .more::after { content: " ▸"; }
  details.claim[open ] summary .more::after { content: " ▾"; }
  details.claim .claimBody { color: #8fa9bd; font-size: 12px; line-height: 1.55; padding: 4px 8px 5px 25px; }
  details.fold { margin: 8px 0 2px; }
  details.fold > summary.foldSum { display: flex; gap: 8px; align-items: baseline; cursor: pointer; list-style: none; color: #9db8cc; font-weight: 700; font-size: 12px; }
  details.fold > summary.foldSum::-webkit-details-marker { display: none; }
  details.fold > summary.foldSum .more { margin-left: auto; flex: none; color: #55707f; font-size: 11px; font-weight: 400; }
  details.fold > summary.foldSum .more::after { content: " ▸"; }
  details.fold[open ] > summary.foldSum .more::after { content: " ▾"; }
  details.fold.handB { border: 1px solid #7a2d2d; background: rgba(240,86,79,.07); border-radius: 8px; padding: 7px 10px; }
  details.fold.handB > summary.foldSum { color: #e8c9c7; font-weight: 400; font-size: 12.5px; }
  details.fold.handB > summary.foldSum .t { color: #f0564f; font-weight: 700; font-size: 12px; }
  details.fold.handB .handBody { margin-top: 5px; font-size: 12.5px; color: #e8c9c7; line-height: 1.55; }
  details.fold.handB .handBody .ntb { color: #8fa9bd; font-size: 11.5px; margin-top: 3px; }
  details.fold .reason { margin-top: 5px; }
</style>
</head>
<body>
  <div class="topbar">
    <div class="logo"><span class="pa">PA</span>战略沙盘</div>
    <div class="seg"><button id="symBTC" class="on">BTCUSDT</button><button id="symETH">ETHUSDT</button></div>
    <div class="seg"><button class="on">15m</button></div>
    <span class="live" id="liveBadge">● LIVE</span>
    <span style="flex:1"></span>
  </div>

  <div class="layout">
    <div class="mainCol">
      <div class="card chartCard">
        <div class="ohlc" id="ohlcLine"></div>
        <div id="chartWrap"><div id="chart"></div><div id="bands"></div></div>
      </div>
      <div class="bottomRow">
        <div class="card"><h3>◎ 事件时间线<span class="r">按住拖动 · 滚轮横移</span></h3><div class="tl" id="tlBody"></div></div>
      </div>
    </div>

    <div class="sideCol" style="display:flex;flex-direction:column;gap:10px">
      <div class="card"><h3>◉ AI 参谋简报<span class="r" id="hypUpd"></span></h3><div id="hypBody"></div></div>
    </div>
  </div>
  <div class="foot" id="footLine"></div>

  <script src="lib/lightweight-charts.standalone.production.js"></script>
  <script src="sandbox.js"></script>
</body>
</html>
